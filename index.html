<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<meta name="theme‑color" content="#080d18">
<title>AI OBJECT DETECTION | MobileNet</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<style>
* {margin:0;padding:0;box‑sizing:border‑box;}
body {font‑family:Arial,sans‑serif;background:#080d18;color:#fff;min‑height:100vh;padding:16px;}
.container {width:100%;max‑width:600px;margin:0 auto;}
.header {text‑align:center;padding:24px 8px;}
.header h1 {font‑size:clamp(22px,5vw,30px);color:#55c8ff;margin‑bottom:10px;}
.header p {color:#aab5c5;font‑size:clamp(12px,3vw,14px);line‑height:1.6;}
.card {background:#121c2d;padding:clamp(16px,4vw,22px);border‑radius:18px;margin‑bottom:18px;border:1px solid #26364e;}
.card h3 {margin‑bottom:14px;font‑size:clamp(15px,4vw,17px);}
input[type="file"] {width:100%;padding:12px 14px;border‑radius:10px;border:1px solid #344761;background:#0b1422;color:white;margin‑top:10px;outline:none;}
button {width:100%;padding:13px;border:none;border‑radius:10px;background:#1689e8;color:white;font‑size:clamp(14px,3vw,15px);font‑weight:bold;margin‑top:12px;cursor:pointer;}
button:hover {background:#0873c9;}
#status {text‑align:center;color:#55c8ff;margin‑top:15px;font‑size:13px;}
#camera‑container {display:flex;justify‑content:center;margin‑top:15px;overflow:hidden;border‑radius:12px;}
#camera‑container canvas {width:100%;height:auto;max‑width:320px;border‑radius:12px;}
#preview img {width:100%;margin‑top:15px;border‑radius:12px;}
.result‑item {margin‑bottom:16px;}
.result‑name {display:flex;justify‑content:space‑between;margin‑bottom:8px;font‑size:14px;}
.progress {background:#26364e;height:10px;border‑radius:20px;overflow:hidden;}
.progress‑bar {height:100%;background:linear‑gradient(90deg,#1689e8,#55c8ff);transition:width 0.3s;}
.footer {text‑align:center;color:#68788e;font‑size:12px;padding:20px 8px;}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>AI OBJECT DETECTION</h1>
<p>MobileNet Image Classification (Langsung Berjalan)</p>
</div>

<div class="card">
<h3>🤖 Status Model</h3>
<p id="status">Sedang memuat model MobileNet…</p>
</div>

<div class="card">
<h3>📷 Deteksi Kamera</h3>
<button onclick="startCamera()" id="cameraBtn" disabled>AKTIFKAN KAMERA</button>
<button onclick="stopCamera()" id="stopBtn" disabled>MATIKAN KAMERA</button>
<div id="camera‑container"></div>
</div>

<div class="card">
<h3>🖼️ Deteksi Upload Gambar</h3>
<input type="file" id="imageInput" accept="image/*">
<div id="preview"></div>
<button onclick="predictImage()" id="predictBtn" disabled>DETEKSI GAMBAR</button>
</div>

<div class="card">
<h3>🤖 Hasil Prediksi</h3>
<div id="results"><p style="color:#aab5c5">Belum ada prediksi</p></div>
</div>

<div class="footer">
AI Classification © 2026
</div>
</div>

<script>
let model = null;
let webcamStream = null;
let isRunning = false;
const statusText = document.getElementById("status");

async function loadMobileNet() {
try {
statusText.innerText = "Memuat MobileNet…";
model = await tf.loadLayersModel('https://storage.googleapis.com/tfjs‑models/tfjs/mobilenet_v2_1.0_224/model.json');
statusText.innerText = "✅ Model MobileNet berhasil dimuat!";
document.getElementById("cameraBtn").disabled = false;
document.getElementById("predictBtn").disabled = false;
} catch(err) {
console.error(err);
statusText.innerText = "❌ Gagal memuat model";
}
}

window.addEventListener("load", loadMobileNet);

async function startCamera() {
if(!model) return alert("Model belum selesai dimuat!");
try {
stopCamera();
webcamStream = await navigator.mediaDevices.getUserMedia({video:{width:320,height:320}});
const video = document.createElement("video");
video.srcObject = webcamStream;
video.autoplay = true;
video.style.maxWidth="320px";
video.style.borderRadius="12px";
document.getElementById("camera‑container").innerHTML="";
document.getElementById("camera‑container").appendChild(video);
await video.play();
isRunning = true;
document.getElementById("stopBtn").disabled = false;
cameraLoop(video);
} catch(err) {
console.error(err);
alert("Izinkan akses kamera (Netlify pakai HTTPS)");
}
}

async function cameraLoop(video) {
if(!isRunning) return;
const canvas = document.createElement("canvas");
canvas.width=224;canvas.height=224;
const ctx = canvas.getContext("2d");
ctx.drawImage(video,0,0,224,224);
await predict(canvas);
requestAnimationFrame(()=>cameraLoop(video));
}

function stopCamera() {
isRunning = false;
if(webcamStream) webcamStream.getTracks().forEach(track=>track.stop());
webcamStream = null;
document.getElementById("stopBtn").disabled = true;
}

async function predictImage() {
if(!model) return alert("Model belum dimuat!");
const file = document.getElementById("imageInput").files[0];
if(!file) return alert("Pilih gambar terlebih dahulu!");
const img = new Image();
img.onload = async function() {
document.getElementById("preview").innerHTML="";
document.getElementById("preview").appendChild(img);
const canvas = document.createElement("canvas");
canvas.width=224;canvas.height=224;
canvas.getContext("2d").drawImage(img,0,0,224,224);
await predict(canvas);
};
img.src = URL.createObjectURL(file);
}

async function predict(sourceCanvas) {
const tensor = tf.browser.fromPixels(sourceCanvas)
.resizeBilinear([224,224])
.toFloat()
.div(127.5)
.sub(1);
const prediction = await model.predict(tensor).data();
tensor.dispose();
showResults(prediction);
}

function showResults(predictionArray) {
const results = document.getElementById("results");
let topIndex = predictionArray.indexOf(Math.max(...predictionArray));
results.innerHTML = `
<div class="result‑item">
<div class="result‑name">
<span>Index Prediksi: ${topIndex}</span>
<strong>${(predictionArray[topIndex]*100).toFixed(1)} %</strong>
</div>
<div class="progress">
<div class="progress‑bar" style="width:${predictionArray[topIndex]*100}%"></div>
</div>
</div>
<p style="color:#aab5c5">Catatan: Ini adalah index (bukan nama kelas, MobileNet asli membutuhkan label map tambahan)</p>
`;
}
</script>
</body></html>
